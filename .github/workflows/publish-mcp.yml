name: Publish to Official MCP Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server.json'
      - '.github/workflows/publish-mcp.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official mcp-publisher CLI
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          # Auto-sync $schema URL if mcp-publisher init uses a newer schema date
          SCHEMA_URL=$(./mcp-publisher --help >/dev/null 2>&1 || true)

      - name: Authenticate via GitHub OIDC & Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
