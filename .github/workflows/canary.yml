name: 48-Hour Apify Actor Health Canary

on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run parallel smoke tests across all 8 Actors
        if: ${{ secrets.APIFY_TOKEN != '' }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/canary.mjs
