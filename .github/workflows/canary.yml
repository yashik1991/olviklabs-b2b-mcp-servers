name: Weekly Apify Actor Health Canary

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run parallel smoke tests across all 8 Actors
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/canary.mjs
